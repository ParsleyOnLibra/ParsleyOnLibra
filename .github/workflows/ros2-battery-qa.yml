name: ROS 2 battery QA

on:
  push:
    paths:
      - 'projects/ros2-learning/**'
      - '.github/workflows/ros2-battery-qa.yml'
  workflow_dispatch:

jobs:
  battery-qa:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Build package and run battery QA cases
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          cd projects/ros2-learning
          colcon build --packages-select battery_qa
          source install/setup.bash
          ros2 pkg executables battery_qa
          python3 -m unittest discover -s tests -v
